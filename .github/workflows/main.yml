name: Katabump Auto Renew

on:
  schedule:
  - cron: '0 2 */3 * *'  # 每 3 天一次 (UTC 2点 = 北京时间 10点),定时自主续期
  workflow_dispatch:
    inputs:
      job_id:
        description: 签到平台任务 id (手动触发可留空)
        required: false
        type: string
      run_id:
        description: 签到平台运行 id (手动触发可留空)
        required: false
        type: string
      callback_url:
        description: 签到平台回调地址 (可选,默认官方 worker)
        required: false
        type: string
      skip_webhook:
        description: 跳过签到平台 webhook 回调 (手动调试用)
        required: false
        type: boolean
        default: false

jobs:
  Renew-Katabump:
    runs-on: ubuntu-latest
    permissions:
      actions: write  
      contents: read
    
    steps:
    - uses: actions/checkout@v6
    - name: ⚙ 设置 Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: 🛠️ 安装系统依赖和python依赖
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb x11-utils xdotool scrot fonts-noto-cjk
        pip install seleniumbase requests
        seleniumbase install chromedriver

    - name: ⚙ 设置代理 (sing-box)
      continue-on-error: true
      env:
        NODE_LINK: ${{ secrets.NODE_LINK }}
      run: |
        bash <(wget -qO- https://main.ssss.nyc.mn/setup_proxy.sh)

    - name: 🚀 运行续期脚本
      env:
        USERS_JSON: ${{ secrets.USERS_JSON }}
        KATABUMP_EMAIL: ${{ secrets.KATABUMP_EMAIL }}
        KATABUMP_PASSWORD: ${{ secrets.KATABUMP_PASSWORD }}
        TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        # 签到平台回调 (cron 定时触发自动跳过,平台/手动触发时上报)
        JOB_ID: ${{ github.event.inputs.job_id || 'katabump-renew' }}
        RUN_ID: ${{ github.event.inputs.run_id || '' }}
        CALLBACK_URL: ${{ github.event.inputs.callback_url || 'https://checkin-cron-worker.wwwqqq001.workers.dev/webhook/checkin' }}
        WEBHOOK_TOKEN: ${{ secrets.WEBHOOK_TOKEN }}
        SKIP_WEBHOOK: ${{ github.event_name == 'schedule' && 'true' || (github.event.inputs.skip_webhook || 'false') }}
      run: |
        xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
          python3 app.py
        
    - name: 🧹 清理旧的工作流运行记录
      if: always()
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        runs=$(gh run list --workflow="${{ github.workflow }}" --limit=100 --json databaseId --jq '.[].databaseId')
        count=0
        for run_id in $runs; do
          count=$((count + 1))
          if [ $count -gt 1 ]; then
            echo "删除运行记录: $run_id"
            gh run delete $run_id || true
          fi
        done
